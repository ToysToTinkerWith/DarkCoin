<text x="892" y="1773" fill="#c9d6e8" font-size="16" font-weight="650" text-anchor="start">Crit Damage + 5%</text><rect x="80" y="1870" width="1440" height="360" rx="18" fill="#0d1320" stroke="#2b3a52"/><text x="120" y="1920" fill="#ffffff" font-size="31" font-weight="950">DAO item potency rule changed</text><text x="120" y="1964" fill="#d5deed" font-size="23" font-weight="700" text-anchor="start">Old rule: item effect potency used the median DAO vote.</text>
<text x="120" y="1998" fill="#d5deed" font-size="23" font-weight="700" text-anchor="start">New rule: item effect potency uses the floor average of valid DAO votes.</text>
<text x="120" y="2032" fill="#d5deed" font-size="23" font-weight="700" text-anchor="start">Valid votes are 1 through 20. Votes of 0 are ignored. Votes above 20 are ignored.</text>
<text x="120" y="2066" fill="#d5deed" font-size="23" font-weight="700" text-anchor="start">Formula: potency = floor(sum(valid votes) / count(valid votes)).</text><rect x="1060" y="1942" width="390" height="220" rx="18" fill="rgba(34,211,238,0.08)" stroke="rgba(34,211,238,0.36)"/><text x="1255" y="1994" fill="#b9f6ff" font-size="21" font-weight="900" text-anchor="middle">Crit defaults</text><text x="1255" y="2046" fill="#ffffff" font-size="44" font-weight="950" text-anchor="middle">25% / 200%</text><text x="1255" y="2090" fill="#c8f6ff" font-size="19" font-weight="750" text-anchor="middle">chance / damage</text><text x="1480" y="2318" fill="#64748b" font-size="18" font-weight="700" text-anchor="end">Dark Coin Arena - Stat Trees and Potency Update</text></svg>